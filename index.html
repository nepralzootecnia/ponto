<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ponto do Grupo</title>
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponto">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --verde:#1b5e20; --verde2:#2e7d32; --verde-claro:#e8f5e9; --fundo:#f3f5f1; --card:#fff; --txt:#1c2419; --sub:#5f6b5a;
  --borda:#dde3d8; --verm:#c62828; --verm-claro:#ffebee; --amar:#f9a825; --amar-claro:#fff8e1; --azul:#1565c0; --azul-claro:#e3f2fd;
  --raio:16px; --sombra:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.topo{background:var(--verde);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
.topo h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{font-size:13px;opacity:.85;font-weight:400}
.topo button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h2 .dir{margin-left:auto;text-transform:none;letter-spacing:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:600;font-size:16px;cursor:pointer;background:var(--verde2);color:#fff;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--verde-claro);color:var(--verde)}
.btn.cinza{background:#eceff1;color:#37474f}
.btn.verm{background:var(--verm)}
.btn.peq{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.gigante{padding:26px 16px;font-size:21px;border-radius:20px;box-shadow:0 6px 18px rgba(46,125,50,.35)}
.btn.gigante.saida{background:#e65100;box-shadow:0 6px 18px rgba(230,81,0,.35)}
.linha-btn{display:flex;gap:8px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.status .bola{width:14px;height:14px;border-radius:50%;background:#b0bec5;flex:none}
.status.dentro .bola{background:#43a047;box-shadow:0 0 0 6px rgba(67,160,71,.18)}
.status b{font-size:18px;display:block}
.status span{color:var(--sub);font-size:14px}
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:12px 0;border-top:1px solid var(--borda);display:flex;gap:12px;align-items:flex-start}
.lista li:first-child{border-top:0;padding-top:2px}
.lista .info{flex:1;min-width:0}
.lista .t{font-weight:600}
.lista .m{color:var(--sub);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eceff1;color:#455a64;white-space:nowrap}
.chip.Urgente,.chip.verm{background:var(--verm-claro);color:var(--verm)}
.chip.Normal,.chip.azul{background:var(--azul-claro);color:var(--azul)}
.chip.Baixa{background:#eceff1;color:#546e7a}
.chip.ok,.chip.Aprovado{background:var(--verde-claro);color:var(--verde)}
.chip.Pendente,.chip.amar{background:var(--amar-claro);color:#8d6e00}
.vazio{color:var(--sub);text-align:center;padding:10px 0;font-size:14px}
.barra{height:10px;background:#e8ece5;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--verde2);border-radius:99px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.nums div{background:var(--fundo);border-radius:12px;padding:10px 4px}
.nums b{display:block;font-size:20px}
.nums span{font-size:12px;color:var(--sub)}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--borda);border-radius:12px;padding:12px;background:#fff;outline:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--verde2)}
.campo small{color:var(--sub);font-size:12px}
.codigo-in{font-size:30px!important;letter-spacing:.35em;text-align:center;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--borda);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
.check input{width:22px;height:22px;accent-color:var(--verde2);flex:none;margin-top:1px}
.check.on{border-color:var(--verde2);background:var(--verde-claro)}
.abas{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:4;scrollbar-width:none}
.abas button{border:0;background:transparent;padding:9px 11px;font-size:15px;border-radius:99px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer}
.abas button.on{background:var(--verde-claro);color:var(--verde)}
.busca{margin-bottom:12px}
.nome-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1.5px solid var(--borda);border-radius:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--verde-claro);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.rel-lista li{cursor:pointer}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--borda)}
.tabela td{padding:8px 4px;border-bottom:1px solid var(--borda)}
.tabela td.n{text-align:right;font-variant-numeric:tabular-nums}
.rel-item{cursor:pointer}
.pct{font-weight:700}
.pct.bom{color:var(--verde2)} .pct.medio{color:#b28704} .pct.ruim{color:var(--verm)}
/* telas sobrepostas */
.tela{position:fixed;inset:0;background:var(--fundo);z-index:50;overflow-y:auto;animation:sobe .18s ease-out}
.tela .cab{background:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:2}
.tela .cab h3{margin:0;font-size:17px;flex:1}
.tela .cab button{border:0;background:#eceff1;border-radius:10px;padding:8px 12px;cursor:pointer}
.tela .corpo{max-width:680px;margin:0 auto;padding:16px 16px 40px}
@keyframes sobe{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
/* câmera */
.cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.cam .vid{position:relative;flex:1;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .guia{position:absolute;left:50%;top:44%;width:62vmin;height:80vmin;max-width:300px;max-height:390px;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:4px solid rgba(255,255,255,.8);transition:border-color .2s}
.cam .guia.ok{border-color:#66bb6a}
.cam .painel{background:#111;color:#fff;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.cam .msg{font-size:19px;font-weight:600;text-align:center;min-height:54px}
.cam .passos{display:flex;gap:8px;justify-content:center;margin:10px 0 14px}
.cam .passos span{font-size:13px;padding:5px 10px;border-radius:99px;background:#333;color:#bbb}
.cam .passos span.on{background:#2e7d32;color:#fff}
.cam .passos span.feito{background:#1b5e20;color:#c8e6c9}
/* carregando e avisos */
.carregando{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600;color:var(--verde)}
.giro{width:42px;height:42px;border:4px solid var(--verde-claro);border-top-color:var(--verde2);border-radius:50%;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263238;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;max-width:92vw;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:sobe .2s}
.toast.erro{background:var(--verm)}
.toast.ok{background:var(--verde2)}
.sucesso{text-align:center;padding:24px 8px 8px}
.sucesso .icone{width:86px;height:86px;border-radius:50%;background:var(--verde-claro);color:var(--verde2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:46px}
.card.sucesso h2,.sucesso h2{margin:0 0 6px;font-size:23px;text-transform:none;letter-spacing:0;color:var(--txt);display:block}
.sucesso p{margin:0;color:var(--sub)}
.aviso{background:var(--amar-claro);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;color:#6d5300}
.aviso.erro{background:var(--verm-claro);color:var(--verm)}
.rodape{text-align:center;padding:20px 0 30px}
.rodape button{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;cursor:pointer}
.slot{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--borda)}
.slot select{grid-column:1/-1}
.slot.simples{grid-template-columns:1fr 1fr;border:0;padding:0}
.slot.simples select{grid-column:auto}
.slot select,.slot input{border:1.5px solid var(--borda);border-radius:10px;padding:10px 6px;background:#fff;width:100%;min-width:0}
.slot button{border:0;background:var(--verm-claro);color:var(--verm);border-radius:10px;width:40px;height:42px;font-size:18px;cursor:pointer}
.grade-dia{margin-bottom:10px}
.grade-dia b{font-size:14px}
.mini{font-size:13px;color:var(--sub)}
.hoje-lista li .chip{margin-top:2px}
.aviso.azul{background:var(--azul-claro);color:#0d3c78}
.aviso a{color:inherit;font-weight:700}
.check .term{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;font-weight:600;color:var(--verde);background:#fff;border-radius:10px;padding:8px 10px;border:1px dashed var(--verde2)}
.check .term input{width:20px;height:20px;accent-color:var(--verde2)}
.check:not(.on) .term{display:none}
.check .chip{font-size:11px;padding:2px 7px;vertical-align:1px}
.part{font-size:13px;color:var(--sub);margin-top:6px}
.part span{display:inline-block;background:var(--fundo);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0}
.foto-aprov{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#eee;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
